# Netlify deployment for ArchPrompt Studio
# Independent backend: Netlify Functions + Netlify Blobs (no Base44, no auth).

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API -> Netlify Functions.
#   /api/projects        -> functions/projects
#   /api/upload          -> functions/upload
#   /api/images?key=...  -> functions/images
# Must come BEFORE the SPA catch-all (first match wins).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback — serve index.html for client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
